<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandOS</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ДИЗАЙН-ТОКЕНЫ
   Все цвета, отступы и размеры — переменные. Аналогия: это палитра
   художника. Меняем краску в одном месте — меняется вся картина.
   ===================================================================== */
:root {
  /* Цвета: тёмная тема с неоновыми акцентами (синий / фиолетовый) */
  --bg: #0A0C1C;          /* фон приложения */
  --s1: #13162E;          /* карточки, уровень 1 */
  --s2: #1A1E3D;          /* поля ввода, наведение, уровень 2 */
  --s3: #222749;          /* всплывающие окна, уровень 3 */
  --line: #2A2F57;        /* линии и рамки */
  --text: #ECEEFB;        /* основной текст */
  --muted: #A3A9D1;       /* второстепенный текст (контраст > 7:1 на --s1) */
  --faint: #8188B5;       /* подписи осей и мета (контраст > 4.5:1) */
  --blue: #4C8DFF;        /* главный акцент: факт, кнопки, ссылки */
  --violet: #9A6BFF;      /* второй акцент: прогноз, ИИ */
  --green: #38D99A;       /* рост, «хорошо» */
  --red: #FF5D7A;         /* риск, кассовый разрыв */
  --amber: #FFB547;       /* предупреждение */
  --wb: #CB11AB;          /* фирменный цвет Wildberries */
  --ozon: #2F6BFF;        /* фирменный цвет Ozon */
  --ym: #FFCC00;          /* фирменный цвет Яндекс Маркета (на нём — тёмный текст) */

  /* Отступы — сетка 4/8 px (скил spacing) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;

  /* Скругления разные по иерархии: крупное — больше, мелкое — меньше */
  --r-lg: 16px; --r-md: 12px; --r-sm: 8px;

  /* Три брейкпоинта (скил viewports): узкий / средний / широкий */
  --vp-narrow: 375px; --vp-medium: 768px; --vp-wide: 1280px;

  --sidebar-w: 240px;
  --hit: 44px;            /* минимальная зона касания (WCAG AA) */
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

/* ===== Базовые стили ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; width: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  /* Цифры одинаковой ширины — колонки сумм не «пляшут» */
  font-variant-numeric: tabular-nums;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: var(--r-sm); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ===== Каркас приложения: меню слева + рабочая область =====
   Почему Grid, а не Flexbox: каркасу нужны две колонки фиксированной роли
   (меню и контент), Grid описывает это одной строкой. */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; width: 100%; }

/* ----- Меню ----- */
.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: var(--sp-4);
  padding: var(--sp-6) var(--sp-3) var(--sp-4);
  background: var(--s1); border-right: 1px solid var(--line);
  overflow-y: auto;
  z-index: 30;
}
.sidebar__brand { display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-2); }
.sidebar__mark { width: 36px; height: 36px; border-radius: 10px; background: var(--violet); box-shadow: 0 0 20px rgba(154,107,255,.55); display: grid; place-items: center; font-weight: 700; color: #fff; }
.sidebar__name { font-weight: 700; font-size: 18px; line-height: 1.2; }
.sidebar__company { font-size: 13px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav__link {
  display: flex; align-items: center; gap: var(--sp-3);
  min-height: var(--hit); padding: 0 var(--sp-3);
  border-radius: var(--r-md); color: var(--muted); font-size: 15px; font-weight: 500;
  transition: background-color .15s, color .15s;
}
.nav__link:hover { background: var(--s2); color: var(--text); text-decoration: none; }
/* Активный пункт — неоновая подсветка: единственное «свечение» в интерфейсе, кроме графика денег */
.nav__link--active { background: rgba(76,141,255,.14); color: var(--text); box-shadow: inset 3px 0 0 var(--blue); }
.nav__link--active .ico { color: var(--blue); }
.nav__count { margin-left: auto; font-size: 12px; color: var(--text); background: var(--red); border-radius: 10px; padding: 0 6px; min-width: 20px; text-align: center; }
.sidebar__bottom { margin-top: auto; display: flex; flex-direction: column; gap: var(--sp-2); }

/* ----- Кнопки ----- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--hit); padding: 0 var(--sp-4);
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--s2);
  font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s;
}
.btn:hover { background: var(--s3); border-color: #3A4074; }
.btn:disabled { opacity: .55; cursor: progress; }
.btn--primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn--primary:hover { background: #3D7DF0; border-color: #3D7DF0; }
.btn--ai { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn--ai:hover { background: #8A5CF0; border-color: #8A5CF0; }
.btn--ghost { background: transparent; }
.btn--danger { color: var(--red); background: transparent; }
.btn--icon { width: var(--hit); padding: 0; }
.btn--sm { min-height: 36px; padding: 0 var(--sp-3); font-size: 14px; }
.btn--block { width: 100%; }

/* ----- Рабочая область ----- */
.workspace { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
  padding: var(--sp-4) var(--sp-6);
  background: rgba(10,12,28,.96); border-bottom: 1px solid var(--line);
}
.topbar__burger { display: none; }
.topbar__hello { min-width: 0; flex: none; }
.topbar__hello h1 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.topbar__hello p { font-size: 13px; color: var(--muted); }
/* Поиск растягивается в свободное место шапки, но не шире 400px */
.search { position: relative; flex: 1 1 200px; max-width: 400px; margin-left: auto; }
.search__input {
  width: 100%; min-height: var(--hit); padding: 0 var(--sp-4) 0 40px;
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--s2);
}
.search__input::placeholder { color: var(--faint); }
.search .ico { position: absolute; left: 12px; top: 12px; color: var(--faint); }
.search__results {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--s3); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: var(--sp-2); display: none; max-height: 360px; overflow-y: auto;
}
.search__results--open { display: block; }
.search__item { display: flex; justify-content: space-between; gap: var(--sp-3); min-height: var(--hit); align-items: center; padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--text); }
.search__item:hover, .search__item:focus-visible { background: var(--s2); text-decoration: none; }
.search__kind { font-size: 12px; color: var(--faint); }
.sources { display: flex; gap: var(--sp-2); align-items: center; }
.source { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.source__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.source--on .source__dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.source--demo .source__dot { background: var(--amber); }
.sync { display: flex; align-items: center; gap: var(--sp-2); font-size: 13px; color: var(--muted); }

/* Основной контент ограничен по ширине (а не всё приложение) — скил viewports */
.page { width: 100%; max-width: var(--vp-wide); margin-inline: auto; padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-6); outline: none; }
.page__head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; }
.page__title { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.page__sub { color: var(--muted); margin-top: var(--sp-1); max-width: 70ch; }
.page__actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

/* ----- Карточки ----- */
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-6); min-width: 0; }
.card--link { display: block; color: inherit; transition: border-color .15s; }
.card--link:hover { border-color: #3D4580; text-decoration: none; }
/* flex-wrap: на узкой карточке подпись справа переносится под заголовок, а не налезает на него */
.card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-4); flex-wrap: wrap; }
.card__title { font-size: 16px; font-weight: 600; }
.card__more { font-size: 14px; white-space: nowrap; }
.card__note { font-size: 13px; color: var(--muted); }

/* Метки «демо» и «оценка» — честно показываем природу цифр */
.tag { display: inline-block; font-size: 12px; font-weight: 500; line-height: 20px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag--demo { color: var(--amber); border-color: rgba(255,181,71,.4); }
.tag--est { color: var(--muted); }
.tag--ai { color: #C6AEFF; border-color: rgba(154,107,255,.45); }
.tag--red { color: var(--red); border-color: rgba(255,93,122,.45); }
.tag--green { color: var(--green); border-color: rgba(56,217,154,.4); }
.tag--blue { color: #9DBDFF; border-color: rgba(76,141,255,.45); }
.tag--amber { color: var(--amber); border-color: rgba(255,181,71,.4); }

.banner { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-4); border-radius: var(--r-md); border: 1px solid rgba(255,181,71,.35); background: rgba(255,181,71,.07); color: var(--text); font-size: 14px; }
.banner .ico { color: var(--amber); margin-top: 2px; }

/* ===== Главная ===== */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--sp-6); align-items: start; }
.home__main, .home__side { display: flex; flex-direction: column; gap: var(--sp-6); min-width: 0; }
/* Контейнерный запрос: колонка KPI подстраивается под ширину СВОЕЙ колонки, а не окна.
   Аналогия: шкаф подбирают под нишу, а не под размер всей квартиры. */
.home__main { container-type: inline-size; container-name: main; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
@container main (min-width: 880px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4) var(--sp-3); }
.kpi__label { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: var(--sp-2); align-items: center; }
.kpi__value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; }
.kpi__foot { display: flex; flex-direction: column; gap: var(--sp-2); }
.spark { width: 100%; height: 32px; }
.delta { font-size: 13px; color: var(--muted); }
.delta--up { color: var(--green); }
.delta--down { color: var(--red); }

.plan__row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
.plan__fact { font-size: 24px; font-weight: 700; }
.bar { position: relative; height: 10px; background: var(--s2); border-radius: 6px; overflow: visible; margin: var(--sp-3) 0; }
.bar__fill { height: 100%; border-radius: 6px; background: var(--blue); }
.bar__fill--violet { background: var(--violet); }
.bar__fill--green { background: var(--green); }
.bar__fill--red { background: var(--red); }
.bar__fill--amber { background: var(--amber); }
.bar__mark { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--text); border-radius: 1px; }
.bar--thin { height: 6px; margin: var(--sp-2) 0 0; }

/* Главный график — «герой» экрана */
.cash { padding-bottom: var(--sp-4); }
.cash__head { display: flex; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-2); }
.cash__title { font-size: 20px; font-weight: 700; }
.cash__status { font-size: 15px; margin-top: var(--sp-1); }
.cash__status--gap { color: var(--red); font-weight: 600; }
.cash__status--ok { color: var(--green); }
.legend { display: flex; gap: var(--sp-4); flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.legend__item { display: inline-flex; align-items: center; gap: 6px; }
.legend__line { width: 18px; height: 0; border-top: 2px solid var(--blue); }
.legend__line--dash { border-top: 2px dashed var(--violet); }
.legend__area { width: 14px; height: 10px; background: rgba(154,107,255,.22); border-radius: 2px; }
.legend__sq { width: 10px; height: 10px; border-radius: 2px; }

.chart { position: relative; width: 100%; min-height: 200px; }
.chart svg { display: block; width: 100%; }
.chart__axis { fill: var(--faint); font-size: 12px; font-family: var(--font); }
.chart__grid { stroke: var(--line); stroke-width: 1; }
.chart__fact { fill: none; stroke: var(--blue); stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(76,141,255,.75)); }
.chart__forecast { fill: none; stroke: var(--violet); stroke-width: 2.5; stroke-dasharray: 6 5; filter: drop-shadow(0 0 6px rgba(154,107,255,.7)); }
.chart__band { fill: rgba(154,107,255,.16); }
.chart__zero { stroke: rgba(255,93,122,.55); stroke-dasharray: 3 4; }
.chart__gap { stroke: var(--red); stroke-width: 2; }
.chart__gap-dot { fill: var(--red); filter: drop-shadow(0 0 6px var(--red)); }
.chart__gap-label { fill: var(--red); font-size: 12px; font-weight: 600; font-family: var(--font); }
.chart__today { stroke: var(--muted); stroke-dasharray: 2 4; }
.chart__guide { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.chart__tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 160px;
  background: var(--s3); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3); font-size: 13px; opacity: 0; transition: opacity .1s;
}
.chart__tip b { display: block; margin-bottom: 2px; }
/* Однократная «прорисовка» линии прогноза — единственная автоматическая анимация */
.chart--intro .chart__fact, .chart--intro .chart__forecast-anim { animation: draw 1.1s ease-out both; }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) 0; border-top: 1px solid var(--line); font-size: 14px; }
.row:first-child { border-top: 0; padding-top: 0; }
.row:last-child { padding-bottom: 0; }
.row__main { min-width: 0; flex: 1; }
.row__title { font-weight: 500; overflow-wrap: anywhere; }
.row__meta { font-size: 13px; color: var(--muted); }
.row__val { text-align: right; white-space: nowrap; font-weight: 600; }
a.row { color: inherit; }
a.row:hover { text-decoration: none; background: var(--s2); }

.channels { display: grid; gap: var(--sp-4); }
.channel { display: grid; grid-template-columns: 132px minmax(0, 1fr) 72px 72px; gap: var(--sp-3); align-items: center; font-size: 14px; }
.channel__head { color: var(--faint); font-size: 12px; }
.channel .bar { margin: 0; }
.num { text-align: right; white-space: nowrap; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-4); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat__val { font-size: 22px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat__label { font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
/* auto-fit вместо жёстких 4 колонок: на среднем экране карточки сами встают 2×2, а не сжимаются */
.stats--4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

.funnel__row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 116px; gap: var(--sp-3); align-items: center; font-size: 13px; padding: 6px 0; }
.funnel__row .num { white-space: nowrap; }
.funnel__bar { height: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--blue), #6E8BFF); min-width: 4px; }

.insight { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-3) 0; border-top: 1px solid var(--line); color: inherit; }
.insight:first-child { border-top: 0; padding-top: 0; }
.insight:hover { text-decoration: none; }
.insight:hover .insight__title { color: var(--blue); }
.insight__title { font-weight: 600; font-size: 14px; }
.insight__meta { display: flex; gap: var(--sp-2); align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.urg { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.urg::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.urg--critical { color: var(--red); }
.urg--today { color: var(--amber); }
.urg--week { color: #9DBDFF; }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.quick .btn { justify-content: flex-start; font-size: 14px; }

/* ===== Таблицы =====
   Правило бухгалтерской книги: текст — влево, числа — вправо, цифры одной ширины
   (tabular-nums), чтобы разряды стояли ровным столбиком. Заголовок колонки выравнивается
   так же, как её значения. */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--s1); }
.table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.table th, .table td { padding: var(--sp-3) var(--sp-4); text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); white-space: nowrap; line-height: 1.4; }
.table th { font-weight: 500; color: var(--muted); font-size: 13px; background: var(--s1); position: sticky; top: 0; z-index: 2; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--s2); }
.table td.wrap { white-space: normal; min-width: 240px; max-width: 420px; }
.table td .row__meta { white-space: normal; max-width: 320px; }
.table .num { text-align: right; }
.table th.num .th-sort { justify-content: flex-end; width: 100%; }
.th-sort { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; display: inline-flex; gap: 4px; align-items: center; min-height: 32px; }

/* ----- Финансовые отчёты (ОПиУ, P&L, ДДС) и РНП -----
   Первая колонка «прилипает» при горизонтальной прокрутке (sticky) —
   как закреплённая колонка в Excel: название строки всегда перед глазами. */
.report th, .report td { text-align: right; }
.report th:first-child, .report td:first-child { position: sticky; left: 0; z-index: 1; text-align: left; white-space: normal; min-width: 260px; background: var(--s1); box-shadow: 1px 0 0 var(--line); }
.report thead th:first-child { z-index: 3; }
/* Заголовки прижаты к низу: месяцы с подписью «по 10.10» и без неё стоят на одной линии */
.report thead th { vertical-align: bottom; }
/* Заголовок строки (th scope="row") выглядит как обычная ячейка, но читалки знают, к какой статье число */
.report tbody th { top: auto; z-index: 1; font-size: 14px; font-weight: 400; color: var(--text); }
.report tbody tr:hover > * { background: var(--s2); }
.report__note { display: block; font-size: 12px; font-weight: 400; color: var(--faint); }
.report .r--head > * { font-weight: 600; }
.report .r--sub > * { font-weight: 600; border-top: 1px solid #3A4074; }
.report tr.r--total > * { font-weight: 700; background: #182045; }
.report .r--detail > * { color: var(--muted); font-size: 13px; padding-top: var(--sp-2); padding-bottom: var(--sp-2); }
.report .r--detail > :first-child { padding-left: var(--sp-8); }
.report .r--pct > * { color: var(--muted); font-size: 13px; }
.report tr.r--section > * { background: var(--s2); font-weight: 600; font-size: 13px; }
.report .col--total { border-left: 1px solid var(--line); }
.report .col--weekend { background: rgba(154,107,255,.05); }
.report tr:hover .col--weekend { background: var(--s2); }
.cell--good { color: var(--green); }
.cell--bad { color: var(--red); }

.signals { display: grid; gap: var(--sp-2); }
.signal { display: flex; gap: var(--sp-3); align-items: flex-start; font-size: 14px; line-height: 1.45; }
.signal::before { content: ''; flex: none; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--faint); }
.signal--bad::before { background: var(--red); }
.signal--good::before { background: var(--green); }
.signal--warn::before { background: var(--amber); }

.report__about { max-width: 80ch; margin-bottom: var(--sp-4); line-height: 1.5; }
.report__foot { margin-top: var(--sp-3); max-width: 90ch; line-height: 1.5; }
/* В РНП колонки-дни узкие: числа короче, первая колонка не такая широкая */
.report--rnp th:first-child, .report--rnp td:first-child { min-width: 200px; }
.report--rnp td, .report--rnp thead th { min-width: 92px; }
.toolbar__sep { width: 1px; align-self: stretch; margin: 4px var(--sp-2); background: var(--line); }
.modal__note { line-height: 1.5; }
/* Карточка внутри карточки — чуть светлее фона, чтобы читалась вложенность */
.card--inner { background: var(--s2); box-shadow: none; }
.templates { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--sp-4); }
.template { display: flex; flex-direction: column; gap: var(--sp-3); }
.template__title { font-weight: 600; }
.template__text { font-size: 14px; color: var(--muted); flex: 1; }
.th-sort:hover { color: var(--text); }
.good { color: var(--green); }
.bad { color: var(--red); }
.warn { color: var(--amber); }
.muted { color: var(--muted); }

/* ===== Фильтры и поля ===== */
.toolbar { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.chip { min-height: 36px; padding: 0 var(--sp-3); border-radius: 18px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
.chip:hover { color: var(--text); border-color: #3D4580; }
.chip--on { background: rgba(76,141,255,.16); border-color: var(--blue); color: var(--text); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field__label { font-size: 14px; color: var(--muted); }
.input, .select, .textarea { width: 100%; min-height: var(--hit); padding: 0 var(--sp-3); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--s2); }
.textarea { padding: var(--sp-3); min-height: 96px; resize: vertical; }
.input--invalid { border-color: var(--red); }
.field__error { font-size: 13px; color: var(--red); min-height: 0; }
.select--inline { min-height: 36px; width: auto; padding: 0 var(--sp-2); font-size: 14px; }
.check { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: var(--hit); font-size: 14px; color: var(--muted); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--blue); }

/* ===== Канбан (задачи и CRM) ===== */
.counters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--sp-4); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: var(--sp-4); overflow-x: auto; padding-bottom: var(--sp-2); align-items: start; }
.board__col { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); min-height: 200px; transition: border-color .15s, background-color .15s; }
.board__col--over { border-color: var(--blue); background: #161B3A; }
.board__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); padding: var(--sp-1) var(--sp-1) var(--sp-2); }
.board__title { font-weight: 600; font-size: 15px; }
.board__meta { font-size: 13px; color: var(--muted); text-align: right; }
.board__empty { font-size: 13px; color: var(--faint); padding: var(--sp-4) var(--sp-2); text-align: center; border: 1px dashed var(--line); border-radius: var(--r-md); }
.tcard { background: var(--s2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-3); cursor: grab; display: flex; flex-direction: column; gap: var(--sp-2); text-align: left; width: 100%; }
.tcard:hover { border-color: #3D4580; }
.tcard--dragging { opacity: .5; }
.tcard__title { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.tcard__meta { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.tcard__sum { font-weight: 600; font-size: 15px; }
.prio { display: inline-flex; align-items: center; gap: 4px; }
.prio::before { content: ''; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.prio--high { color: var(--red); }
.prio--medium { color: var(--amber); }
.prio--low { color: var(--faint); }
.overdue { color: var(--red); }

/* ===== Центр решений ===== */
.tabs { display: flex; gap: var(--sp-2); flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { min-height: var(--hit); padding: 0 var(--sp-3); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-size: 15px; font-weight: 500; margin-bottom: -1px; }
.tab:hover { color: var(--text); }
.tab--on { color: var(--text); border-bottom-color: var(--blue); }
.tab__n { color: var(--faint); margin-left: 4px; }
.decisions { display: grid; gap: var(--sp-4); }
.decision { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: var(--sp-6); }
.decision__top { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; margin-bottom: var(--sp-2); }
.decision__title { font-size: 19px; font-weight: 700; line-height: 1.3; margin-bottom: var(--sp-3); }
.decision__text { color: var(--muted); font-size: 14px; max-width: 70ch; }
.decision__text b { color: var(--text); font-weight: 500; }
.decision__steps { margin: var(--sp-3) 0 0; padding-left: 20px; font-size: 14px; display: grid; gap: 4px; }
.decision__side { display: flex; flex-direction: column; gap: var(--sp-3); border-left: 1px solid var(--line); padding-left: var(--sp-6); }
.decision__effect { font-size: 24px; font-weight: 700; color: var(--green); line-height: 1.2; }
.decision__actions { display: grid; gap: var(--sp-2); margin-top: auto; }
.empty { text-align: center; padding: var(--sp-12) var(--sp-6); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
.empty__title { color: var(--text); font-size: 18px; font-weight: 600; }

/* ===== Интеграции ===== */
.integ { display: flex; flex-direction: column; gap: var(--sp-3); }
.integ__top { display: flex; align-items: center; gap: var(--sp-3); }
.logo { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }
.integ__name { font-weight: 600; }
.integ__desc { font-size: 14px; color: var(--muted); }
.integ__status { font-size: 14px; }
.integ__err { font-size: 14px; color: var(--red); background: rgba(255,93,122,.08); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); overflow-wrap: anywhere; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--s2); padding: 1px 6px; border-radius: 4px; color: var(--text); }
.group-title { font-size: 18px; font-weight: 600; margin-top: var(--sp-2); }

/* ===== Модальное окно ===== */
.modal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: var(--sp-4); background: rgba(4,5,14,.72); }
.modal--open { display: grid; }
.modal__box { width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--s3); border: 1px solid var(--line); border-radius: var(--r-lg); }
.modal__head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-4) 0 var(--sp-6); }
.modal__title { font-size: 20px; font-weight: 700; }
.modal__body { padding: var(--sp-4) var(--sp-6); display: grid; gap: var(--sp-4); }
.modal__foot { display: flex; gap: var(--sp-2); justify-content: flex-end; padding: 0 var(--sp-6) var(--sp-6); flex-wrap: wrap; }
.modal__foot .btn--danger { margin-right: auto; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }

/* ===== ИИ-ассистент: выезжающая панель справа ===== */
.chat {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(420px, 100%);
  display: flex; flex-direction: column; background: var(--s3); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .25s ease; visibility: hidden;
}
.chat--open { transform: none; visibility: visible; }
.chat__head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--line); }
.chat__title { font-weight: 700; font-size: 18px; }
.chat__sub { font-size: 13px; color: var(--muted); }
.chat__log { flex: 1; overflow-y: auto; padding: var(--sp-4) var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-3); }
.msg { max-width: 88%; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg--user { align-self: flex-end; background: var(--blue); color: #fff; }
.msg--bot { align-self: flex-start; background: var(--s2); border: 1px solid var(--line); }
.msg--wait { color: var(--muted); }
.chat__hints { display: flex; gap: var(--sp-2); flex-wrap: wrap; padding: 0 var(--sp-6) var(--sp-3); }
.chat__form { display: flex; gap: var(--sp-2); padding: var(--sp-4) var(--sp-6) var(--sp-6); border-top: 1px solid var(--line); }
.chat__form .input { flex: 1; }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgba(4,5,14,.6); display: none; }
.scrim--on { display: block; }

/* Предпросмотр документа: на весь экран, сверху панель действий, ниже — сам лист */
.docview { position: fixed; inset: 0; z-index: 55; display: grid; grid-template-rows: auto minmax(0, 1fr); background: rgba(4,5,14,.85); }
.docview__bar { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; justify-content: space-between; padding: var(--sp-3) var(--sp-4); background: var(--s1); border-bottom: 1px solid var(--line); }
.docview__title { font-size: 15px; }
.docview__actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.docview__frame { width: 100%; height: 100%; border: 0; background: #EEF0F4; }
.toast { position: fixed; left: 50%; bottom: var(--sp-6); transform: translateX(-50%); z-index: 60; background: var(--s3); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); font-size: 14px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast--on { opacity: 1; }

/* =====================================================================
   АДАПТИВНОСТЬ
   Широкий (≥1280): главная в две колонки (контент + правая панель).
   Средний (768–1279): правая панель уходит вниз, KPI по два в ряд.
   Узкий (<768): меню прячется в бургер, всё в одну колонку.
   ===================================================================== */
@media (max-width: 1279.98px) {
  .home { grid-template-columns: minmax(0, 1fr); }
  .home__side { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .decision { grid-template-columns: minmax(0, 1fr); }
  .decision__side { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: var(--sp-4); }
  .decision__actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 767.98px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  /* Меню превращается в выезжающую шторку — те же пункты, доступ через бургер */
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-100%); transition: transform .25s ease; visibility: hidden; }
  .sidebar--open { transform: none; visibility: visible; }
  .topbar { padding: var(--sp-3) var(--sp-4); gap: var(--sp-3); }
  .topbar__burger { display: inline-flex; }
  .topbar__hello h1 { font-size: 17px; }
  .topbar__hello { flex: 1; }
  .search { order: 5; flex-basis: 100%; max-width: none; margin-left: 0; }
  .sources { display: none; }
  .sync__text { display: none; }
  .page { padding: var(--sp-4); gap: var(--sp-4); }
  .page__title { font-size: 24px; }
  .card { padding: var(--sp-4); }
  /* .stats--4 сюда не входит: auto-fit сам даст 1 колонку на телефоне и 2 на узком планшете */
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi__value { font-size: 24px; }
  .channel { grid-template-columns: 90px minmax(0, 1fr) 60px 56px; gap: var(--sp-2); font-size: 13px; }
  .cards, .home__side { grid-template-columns: minmax(0, 1fr); }
  /* Задачи на телефоне — колонки друг под другом, без горизонтальной прокрутки */
  .board--stack { grid-auto-flow: row; grid-auto-columns: auto; overflow: visible; }
  .board { grid-auto-columns: minmax(260px, 85%); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .decision__actions { grid-template-columns: minmax(0, 1fr); }
  .modal { padding: 0; place-items: end stretch; }
  .modal__box { max-width: none; max-height: 92vh; border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .funnel__row { grid-template-columns: 92px minmax(0, 1fr) 116px; gap: var(--sp-2); }
  /* Отчёты на телефоне: закреплённая колонка уже, числа — мельче, остальное листается вбок */
  .report th:first-child, .report td:first-child { min-width: 150px; max-width: 170px; }
  .report th, .report td { padding: var(--sp-2) var(--sp-3); font-size: 13px; }
  .report .r--detail > :first-child { padding-left: var(--sp-4); }
  .report tbody th { font-size: 13px; }
  .table td.wrap { min-width: 200px; }
}

/* Уважаем системную настройку «уменьшить движение» */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app">
  <!-- Меню слева -->
  <aside class="sidebar" id="sidebar" aria-label="Главное меню">
    <div class="sidebar__brand">
      <div class="sidebar__mark" aria-hidden="true">B</div>
      <div>
        <div class="sidebar__name">BrandOS</div>
        <div class="sidebar__company" id="companyName">Северный Кот</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar__bottom">
      <button class="btn btn--ai btn--block" type="button" data-action="chat-open">
        <svg class="ico"><use href="#i-spark"/></svg> ИИ-ассистент
      </button>
      <a class="nav__link" href="/logout" id="logoutLink" hidden><svg class="ico"><use href="#i-logout"/></svg> Выйти</a>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-action="scrim"></div>

  <div class="workspace">
    <header class="topbar">
      <button class="btn btn--icon btn--ghost topbar__burger" type="button" data-action="menu" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false">
        <svg class="ico"><use href="#i-menu"/></svg>
      </button>
      <div class="topbar__hello">
        <h1 id="greeting">Добрый день</h1>
        <p id="today"></p>

<script>
'use strict';
/* =====================================================================
   BrandOS — логика интерфейса на чистом JavaScript (ES6+).

   Как это устроено (аналогия с рестораном):
   • DEMO — «витрина с муляжами»: все примеры данных в одном объекте.
   • state — «кухня»: текущие данные, страница, фильтры.
   • render() — «официант»: берёт данные из state и выкладывает HTML.
   • Обработчики событий — «заказы гостей»: меняют state и зовут render().

   Режимы:
   • demo — файл открыт без сервера: всё на примерах, задачи/сделки в localStorage;
   • live — открыт через сервер: реальные данные из API, хранение на сервере.
   ===================================================================== */

// ===== Мелкие помощники =====
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
// Экранирование текста — защита от подстановки чужого HTML (XSS)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f = (x) => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const rub = (n) => (n == null || Number.isNaN(n) ? '—' : `${nf.format(Math.round(n))} ₽`);
// Короткий формат для крупных сумм: 1,24 млн ₽ / 456 тыс ₽
function short(n) {
  if (n == null) return '—';
  const a = Math.abs(n);
  if (a >= 1e6) return `${(n / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: 2 })} млн ₽`;
  if (a >= 1e4) return `${nf.format(Math.round(n / 1e3))} тыс ₽`;
  return rub(n);
}
const shortNum = (n) => { const a = Math.abs(n); return a >= 1e6 ? `${(n / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: 1 })} млн` : a >= 1e3 ? `${Math.round(n / 1e3)} тыс` : String(Math.round(n)); };
const pct = (n, d = 1) => (n == null ? '—' : `${Number(n).toLocaleString('ru-RU', { maximumFractionDigits: d })}%`);
// Даты: локальная YYYY-MM-DD (для сроков задач важен день пользователя, а не UTC)
const localIso = (d = new Date()) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const addDays = (n) => localIso(new Date(Date.now() + n * 86400000));
const dmy = (iso) => (iso ? String(iso).slice(0, 10).split('-').reverse().join('.') : '—');
const dm = (iso) => (iso ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}` : '');
const daysBetween = (iso) => Math.round((new Date(iso + 'T00:00:00') - new Date(localIso() + 'T00:00:00')) / 86400000);
const icon = (id) => `<svg class="ico" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const uidLocal = (p) => `${p}_${Math.random().toString(36).slice(2, 10)}`;
// Короткое и полное имя площадки: короткое — в таблицах, полное — в заголовках
const MP = { wb: ['WB', 'Wildberries', 'var(--wb)'], ozon: ['Ozon', 'Ozon', 'var(--ozon)'], ym: ['ЯМ', 'Яндекс Маркет', 'var(--ym)'] };
const mpName = (mp) => MP[mp]?.[0] || mp;
const mpFull = (mp) => MP[mp]?.[1] || mp;
const LS = {
  get(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* приватный режим — не страшно */ } }
};

// Демо: какая доля выручки доходит до продавца после удержаний площадки
const DEMO_PAY = { wb: 0.69, ozon: 0.66, ym: 0.74 };
const MONTHS_RU = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

/* Демо-отчёты (ОПиУ, P&L по каналам, ДДС, РНП, налоги) в той же структуре, что отдаёт сервер:
   { columns: [{ key, label, note }], rows: [{ key, label, type, values }] }.
   Так одна и та же функция отрисовки работает и с примером, и с реальными данными. */
function buildDemoReports(daily, { cashNow, fixed, cogsPct, ads }) {
  const now = new Date();
  const CH = [['wb', 'Wildberries'], ['ozon', 'Ozon'], ['ym', 'Яндекс Маркет']];
  // Строка отчёта — как row() на сервере: проценты с одним знаком, рубли целыми
  const row = (key, label, type, values) => ({ key, label, type, values: values.map((v) => (v == null ? null : type === 'pct' ? +v.toFixed(1) : Math.round(v))) });
  const pctOf = (a, b) => (b ? (a / b) * 100 : 0);
  const tax6 = (r) => r * 0.06;

  // ----- ОПиУ: два полных месяца и текущий «по сегодня» -----
  const months = [-2, -1, 0].map((k, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() + k, 1);
    const inMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const share = k === 0 ? now.getDate() / inMonth : 1;
    return { label: `${MONTHS_RU[d.getMonth()]} ${d.getFullYear()}`, note: k === 0 ? `по ${dm(localIso())}` : '', share, days: Math.round(share * inMonth), trend: [0.93, 1, 1.06][i] };
  });
  const opCol = (m) => {
    const revenue = 4300000 * m.share * m.trend;
    const byCh = { wb: revenue * 0.6, ozon: revenue * 0.31, ym: revenue * 0.09 };
    const payout = sum(CH, ([k]) => byCh[k] * DEMO_PAY[k]);
    const cogs = revenue * cogsPct, adSpend = 183000 * m.share * m.trend, fx = fixed * m.share;
    const ebt = payout - cogs - adSpend - fx, tax = tax6(revenue);
    return { revenue, byCh, payout, cogs, ads: adSpend, fixed: fx, gross: payout - cogs, ebt, tax, net: ebt - tax };
  };
  const cols = months.map(opCol);
  // Колонка «Итого» — сумма месяцев по каждому полю
  const total = { byCh: {} };
  for (const k of ['revenue', 'payout', 'cogs', 'ads', 'fixed', 'gross', 'ebt', 'tax', 'net']) total[k] = sum(cols, (c) => c[k]);
  for (const [k] of CH) total.byCh[k] = sum(cols, (c) => c.byCh[k]);
  const all = [...cols, total];
  const v = (f) => all.map(f);
  const FIXED_ITEMS = [['Аренда мастерской', 180000], ['Зарплата офиса и склада', 220000], ['Сервисы, связь, бухгалтерия', 50000]];
  const opiu = {
    columns: [...months.map((m, i) => ({ key: `m${i}`, label: m.label, note: m.note })), { key: 'total', label: 'Итого', note: `${sum(months, (m) => m.days)} дн.` }],
    rows: [
      row('revenue', 'Выручка', 'head', v((c) => c.revenue)),
      ...CH.map(([k, name]) => row(`rev_${k}`, name, 'detail', v((c) => c.byCh[k]))),
      row('mp', 'Комиссии, логистика и услуги маркетплейсов', 'item', v((c) => -(c.revenue - c.payout))),
      row('payout', 'Выплаты маркетплейсов', 'sub', v((c) => c.payout)),
      row('cogs', 'Себестоимость проданного товара', 'item', v((c) => -c.cogs)),
      row('gross', 'Валовая прибыль', 'sub', v((c) => c.gross)),
      row('ads', 'Реклама на маркетплейсах', 'item', v((c) => -c.ads)),
      row('fixed', 'Постоянные расходы', 'item', v((c) => -c.fixed)),
      ...FIXED_ITEMS.map(([name, amount], i) => row(`fixed${i}`, name, 'detail', v((c) => (-c.fixed * amount) / fixed))),
      row('ebt', 'Прибыль до налога (как на главной)', 'sub', v((c) => c.ebt)),
      row('tax', 'Налог УСН (доходы, 6%)', 'item', v((c) => -c.tax)),
      row('net', 'Чистая прибыль', 'total', v((c) => c.net)),
      row('margin', 'Рентабельность по чистой прибыли', 'pct', v((c) => pctOf(c.net, c.revenue))),
      row('grossMargin', 'Валовая маржа', 'pct', v((c) => pctOf(c.gross, c.revenue)))
    ],
    note: 'Пример. В рабочем режиме выручка и выплаты берутся из кабинетов маркетплейсов, реклама — из рекламных кабинетов.'
  };

  // ----- P&L по каналам за 30 дней (итог «Прибыль до налога» = прибыль на главной) -----
  const revAll = sum(daily, (d) => d.wb + d.ozon + d.ym);
  const chCol = ([k]) => {
    const revenue = sum(daily, (d) => d[k]);
    const payout = revenue * DEMO_PAY[k], cogs = revenue * cogsPct, adSpend = ads[k];
    const contribution = payout - cogs - adSpend, fx = (fixed * revenue) / revAll, ebt = contribution - fx, tax = tax6(revenue);
    return { revenue, payout, cogs, ads: adSpend, contribution, fixed: fx, ebt, tax, net: ebt - tax };
  };
  const pc = CH.map(chCol);
  const pt = {};
  for (const k of Object.keys(pc[0])) pt[k] = sum(pc, (c) => c[k]);
  const pAll = [...pc, pt];
  const pv = (f) => pAll.map(f);
  const pnl = {
    columns: [...CH.map(([key, label]) => ({ key, label })), { key: 'total', label: 'Итого', note: '30 дней' }],
    rows: [
      row('revenue', 'Выручка', 'head', pv((c) => c.revenue)),
      row('share', 'Доля в выручке', 'pct', pv((c) => pctOf(c.revenue, pt.revenue))),
      row('mp', 'Удержания маркетплейса', 'item', pv((c) => -(c.revenue - c.payout))),
      row('payout', 'Выплаты', 'sub', pv((c) => c.payout)),
      row('cogs', 'Себестоимость', 'item', pv((c) => -c.cogs)),
      row('ads', 'Реклама', 'item', pv((c) => -c.ads)),
      row('drr', 'ДРР (реклама к выручке)', 'pct', pv((c) => pctOf(c.ads, c.revenue))),
      row('contribution', 'Маржинальный доход канала', 'sub', pv((c) => c.contribution)),
      row('fixed', 'Постоянные расходы (по доле выручки)', 'item', pv((c) => -c.fixed)),
      row('ebt', 'Прибыль до налога', 'sub', pv((c) => c.ebt)),
      row('tax', 'Налог УСН', 'item', pv((c) => -c.tax)),
      row('net', 'Чистая прибыль', 'total', pv((c) => c.net)),
      row('margin', 'Рентабельность', 'pct', pv((c) => pctOf(c.net, c.revenue)))
    ],
    note: 'Маржинальный доход — сколько канал оставляет после своих прямых расходов. Постоянные расходы делятся между каналами пропорционально выручке.'
  };

  // ----- ДДС: остаток на конец текущего месяца = «Деньги на счетах» на главной -----
  const ddsCol = (m, i, c) => {
    const s = m.share;
    const by = {
      mp_in: c.payout * 0.96, cust_in: 150000 * s, other_in: 12000 * s,
      tax: -360000 * s, salary: -560000 * s, rent: -180000 * s, ads: -c.ads * 0.4, bank: -6500 * s,
      logistics: -45000 * s, supplier: -c.cogs * [1.02, 1.12, 0.95][i],
      capex: i === 1 ? -95000 : 0, owner_out: i < 2 ? -150000 : 0
    };
    const keysOf = (sec, dir) => DDS_DEMO.filter((x) => x[2] === sec && (!dir || x[3] === dir)).map((x) => x[0]);
    const s2 = (keys) => sum(keys, (k) => by[k] || 0);
    return { by, opIn: s2(keysOf('op', 'in')), opOut: s2(keysOf('op', 'out')), op: s2(keysOf('op')), inv: s2(keysOf('inv')), fin: s2(keysOf('fin')) };
  };
  const dc = months.map((m, i) => ddsCol(m, i, cols[i]));
  dc.forEach((c) => { c.net = c.op + c.inv + c.fin; });
  // Остатки считаем «с конца»: знаем сегодняшний остаток и вычитаем потоки месяцев назад
  let close = cashNow;
  for (let i = dc.length - 1; i >= 0; i--) { dc[i].close = close; dc[i].open = close - dc[i].net; close = dc[i].open; }
  const dt = { by: {}, open: dc[0].open, close: dc.at(-1).close };
  for (const k of ['opIn', 'opOut', 'op', 'inv', 'fin', 'net']) dt[k] = sum(dc, (c) => c[k]);
  for (const [k] of DDS_DEMO) dt.by[k] = sum(dc, (c) => c.by[k] || 0);
  const dAll = [...dc, dt];
  const dv = (f) => dAll.map(f);
  const items = (sec, dir) => DDS_DEMO.filter((x) => x[2] === sec && (!dir || x[3] === dir) && dAll.some((c) => c.by[x[0]]))
    .map(([k, label]) => row(k, label, 'detail', dv((c) => c.by[k] || 0)));
  const dds = {
    columns: opiu.columns,
    rows: [
      row('open', 'Остаток на начало периода', 'head', dv((c) => c.open)),
      row('s_op', 'Операционная деятельность', 'section', dv(() => null)),
      row('opIn', 'Поступления', 'item', dv((c) => c.opIn)), ...items('op', 'in'),
      row('opOut', 'Платежи', 'item', dv((c) => c.opOut)), ...items('op', 'out'),
      row('op', 'Сальдо операционной деятельности', 'sub', dv((c) => c.op)),
      row('s_inv', 'Инвестиционная деятельность', 'section', dv(() => null)), ...items('inv'),
      row('inv', 'Сальдо инвестиционной деятельности', 'sub', dv((c) => c.inv)),
      row('s_fin', 'Финансовая деятельность', 'section', dv(() => null)), ...items('fin'),
      row('fin', 'Сальдо финансовой деятельности', 'sub', dv((c) => c.fin)),
      row('net', 'Чистый денежный поток', 'total', dv((c) => c.net)),
      row('close', 'Остаток на конец периода', 'head', dv((c) => c.close))
    ],
    unknown: 0,
    note: 'Пример. В рабочем режиме статьи определяются по контрагенту и назначению платежа из выписки банка.'
  };

  // ----- РНП: по каждому дню и каналу -----
  const AVG = { wb: 1850, ozon: 2100, ym: 1650 };
  const rnp = {
    days: daily.map((d, i) => {
      const out = { date: d.date };
      CH.forEach(([k], j) => {
        const wave = 1 + 0.08 * Math.sin(i * 1.7 + j);
        const ordersSum = d[k] * 1.12 * wave;
        const orders = Math.round(ordersSum / AVG[k]);
        out[k] = {
          orders, ordersSum: Math.round(ordersSum), sales: d[k], payout: Math.round(d[k] * DEMO_PAY[k]), cogs: Math.round(d[k] * cogsPct),
          ads: Math.round((ads[k] / 30) * (1 + 0.25 * Math.cos(i / 2 + j))), returns: Math.max(0, Math.round(orders * 0.035 * wave + (i % 5 === j ? 2 : 0) - 1))
        };
      });
      return out;
    }),
    channels: CH.map(([k]) => k),
    planPerDay: Math.round(4000000 / new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate()),
    maxDrr: 15,
    fixedPerDay: Math.round(fixed / 30)
  };

  // ----- Налоги: прошедшие кварталы целиком, текущий — частично -----
  const year = now.getFullYear();
  const curQ = Math.floor(now.getMonth() / 3) + 1;
  const qStart = (q) => new Date(year, (q - 1) * 3, 1);
  const quarters = [1, 2, 3, 4].map((q) => {
    const totalDays = q < curQ ? Math.round((qStart(q + 1) - qStart(q)) / 86400000) : q === curQ ? Math.round((new Date(year, now.getMonth(), now.getDate()) - qStart(q)) / 86400000) + 1 : 0;
    const full = [11850000, 12420000, 12960000, 13300000][q - 1];
    const share = q < curQ ? 1 : q === curQ ? totalDays / Math.round((qStart(q + 1) - qStart(q)) / 86400000) : 0;
    const income = Math.round(full * share);
    return {
      q, income, expense: Math.round(income * 0.86), contributions: q < curQ ? 180000 : 0, mpAdjust: Math.round(income * 0.32),
      days: totalDays, totalDays, source: q > curQ ? 'none' : q === curQ ? 'partial' : 'data', future: q > curQ
    };
  });
  const qFrom = localIso(qStart(curQ));
  const incomeOps = [
    [0, 612400, 'ООО «Вайлдберриз»', 'Перечисление по отчёту о реализации', true],
    [-3, 389600, 'ООО «Интернет Решения»', 'Выплата Ozon за период', true],
    [-5, 117300, 'ООО «Яндекс»', 'Выплата Яндекс Маркета по договору', true],
    [-7, 82000, 'ООО «Хвост»', 'Оплата по счёту 117', false],
    [-8, 598200, 'ООО «Вайлдберриз»', 'Перечисление по отчёту о реализации', true]
  ].map(([d, amount, party, purpose, mp]) => ({ date: addDays(d), amount, party, purpose, mp })).filter((o) => o.date >= qFrom).reverse();
  const tax = {
    year, rate: 6, taxObject: 'income',
    taxpayer: { kind: 'ИП', name: 'Иванов Алексей Петрович', inn: '771234567890', kpp: '', oktmo: '45380000', ifns: '7701', phone: '+7 900 000-00-00', hasEmployees: true },
    quarters, incomeOps, coverageFrom: addDays(-59)
  };

  return { opiu, pnl, dds, rnp, tax };
}
// Статьи ДДС для примера: [ключ, название, раздел, направление] — порядок как в отчёте сервера
const DDS_DEMO = [
  ['mp_in', 'Выплаты маркетплейсов', 'op', 'in'], ['cust_in', 'Оплаты от покупателей', 'op', 'in'], ['other_in', 'Прочие поступления', 'op', 'in'],
  ['tax', 'Налоги и взносы', 'op', 'out'], ['salary', 'Зарплата', 'op', 'out'], ['rent', 'Аренда', 'op', 'out'], ['ads', 'Реклама и продвижение', 'op', 'out'],
  ['bank', 'Банковские комиссии', 'op', 'out'], ['logistics', 'Доставка и логистика', 'op', 'out'], ['supplier', 'Поставщики: товар и материалы', 'op', 'out'],
  ['capex', 'Оборудование и основные средства', 'inv', 'out'], ['owner_out', 'Выплаты собственнику', 'fin', 'out']
];

/* =====================================================================
   ДЕМО-ДАННЫЕ — всё в одном объекте, чтобы потом подставить реальные.
   Даты строятся от «сегодня», поэтому демо всегда выглядит свежим.
   Пример бизнеса: мастерская «Северный Кот» — мебель для животных.
   ===================================================================== */
function buildDemo() {
  // Детерминированный генератор случайных чисел: при каждой загрузке одинаковые «случайности»
  let seed = 42;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const days30 = Array.from({ length: 30 }, (_, i) => addDays(i - 29));
  const daily = days30.map((date, i) => ({
    date,

async function api(method, url, body, headers) {
  const isFile = body instanceof Blob;
  const res = await fetch(url, {
    method,
    credentials: 'same-origin',
    headers: isFile ? headers : body ? { 'Content-Type': 'application/json' } : undefined,
    body: isFile ? body : body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { location.href = '/login'; throw new Error('Нужно войти'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Ошибка сервера (${res.status})`);
  return data;
}

// Подставляем живые блоки поверх демо: если блок в списке demo — остаётся пример
function mergeLive(live) {
  const data = structuredClone(DEMO);
  for (const [k, v] of Object.entries(live)) {
    if (k === 'kpi') {
      for (const [kk, vv] of Object.entries(v)) if (!live.demo.includes(`kpi.${kk}`)) data.kpi[kk] = vv;
    } else if (!live.demo.includes(k) && v != null) data[k] = v;
  }
  // Блоки «демо» берём из примера целиком
  for (const k of live.demo) if (!k.includes('.') && DEMO[k] !== undefined) data[k] = structuredClone(DEMO[k]);
  return data;
}

function upsert(arr, item) {
  const i = arr.findIndex((x) => x.id === item.id);
  if (i === -1) arr.unshift(item); else arr[i] = { ...arr[i], ...item };
  return item;
}

// Разбор документа по имени файла — для демо-режима (та же логика, что на сервере без ИИ)
function classifyByName(name, source) {
  const n = name.toLowerCase();
  let type = 'Другое';
  if (/сч[её]т-?фактур/.test(n)) type = 'Счёт-фактура';
  else if (/сч[её]т|invoice/.test(n)) type = 'Счёт';
  else if (/упд/.test(n)) type = 'УПД';
  else if (/акт/.test(n)) type = 'Акт';
  else if (/договор/.test(n)) type = 'Договор';
  else if (/наклад/.test(n)) type = 'Накладная';
  else if (/отч[её]т/.test(n)) type = 'Отчёт';
  const needPay = type === 'Счёт';
  const needSign = ['Акт', 'УПД', 'Договор'].includes(type);
  return { type, counterparty: '', amount: null, due: addDays(3), needSign, needPay, section: needPay ? 'Финансы' : 'Прочее', summary: 'Разобрано по имени файла (демо-режим, ИИ не подключён).', by: 'rules' };
}

// Решения: принять / отложить / отклонить
async function decide(id, action, reason) {
  if (state.mode === 'live') {
    await api('POST', `/api/decisions/${id}/${action}`, action === 'reject' ? { reason } : {});
    const [dec, tasks] = await Promise.all([api('GET', '/api/decisions'), api('GET', '/api/tasks')]);
    state.decisions = dec.decisions; state.decMeta = dec; state.tasks = tasks;
  } else {
    const d = state.decisions.find((x) => x.id === id);
    if (action === 'accept') {
      const role = { реклама: 'Дмитрий', склад: 'Олег', финансы: 'Ирина', документы: 'Ирина', CRM: 'Марина', продажи: 'Марина', цены: 'Алексей' }[d.area] || 'Алексей';
      d.taskIds = [];
      for (const step of d.steps) {
        const t = { title: step, status: 'todo', priority: d.urgency === 'на неделе' ? 'medium' : 'high', due: d.due, assignee: role, byAI: d.source === 'ai', decisionId: d.id };
        await saveTask(t);
        d.taskIds.push(t.id);
      }
      d.status = 'inprogress';
    }
    if (action === 'postpone') { d.status = 'postponed'; d.postponedUntil = new Date(Date.now() + 3 * 86400000).toISOString(); }
    if (action === 'reject') { d.status = 'rejected'; d.rejectReason = reason; }
    persistDemo();
  }
  render();
}

// Прогресс решения считаем по его задачам
function decisionProgress(d) {
  const tasks = state.tasks.filter((t) => t.decisionId === d.id || (d.taskIds || []).includes(t.id));
  if (!tasks.length) return { done: 0, total: 0, pct: 0 };
  const done = tasks.filter((t) => t.status === 'done').length;
  return { done, total: tasks.length, pct: Math.round((done / tasks.length) * 100) };
}
function decisionStatus(d) {
  if (d.status === 'postponed' && new Date(d.postponedUntil) < new Date()) return 'new';
  if (d.status === 'inprogress') { const p = decisionProgress(d); if (p.total && p.done === p.total) return 'done'; }
  return d.status;
}

/* =====================================================================
   ГРАФИКИ НА ЧИСТОМ SVG
   Почему не библиотека: нам нужно 3 вида графиков, а SVG — это просто
   «рисование координатами». Аналогия: миллиметровка, где мы сами
   ставим точки и соединяем их линией.
   ===================================================================== */
function sparkline(values, color) {
  const v = values.filter((x) => x != null);
  if (v.length < 2) return '';
  const w = 96, h = 32, min = Math.min(...v), max = Math.max(...v), span = max - min || 1;
  const pts = v.map((y, i) => `${((i / (v.length - 1)) * w).toFixed(1)},${(h - 3 - ((y - min) / span) * (h - 6)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

// График денег: факт (сплошная), прогноз (пунктир), коридор, красная отметка разрыва
function cashSvg(cf, W, H) {
  const pad = { l: 64, r: 16, t: 24, b: 28 };
  const days = cf.days;
  const n = days.length;
  const vals = days.flatMap((d) => [d.fact, d.forecast, d.lo, d.hi]).filter((v) => v != null);
  let min = Math.min(0, ...vals), max = Math.max(...vals);
  const span = max - min || 1;
  min -= span * 0.06; max += span * 0.08;
  const x = (i) => pad.l + (i * (W - pad.l - pad.r)) / (n - 1);
  const y = (v) => pad.t + ((max - v) * (H - pad.t - pad.b)) / (max - min);
  const line = (key) => days.map((d, i) => (d[key] == null ? null : `${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`)).filter(Boolean).join(' ');

  let grid = '';
  for (let t = 0; t <= 4; t++) {
    const v = min + ((max - min) * t) / 4;
    grid += `<line class="chart__grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="chart__axis" x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end">${shortNum(v)}</text>`;
  }
  const step = Math.ceil(n / (W < 520 ? 4 : 8));
  let xl = '';
  // Последнюю дату подписываем всегда, а обычную метку рядом с ней пропускаем, чтобы подписи не слипались
  days.forEach((d, i) => { if ((i % step === 0 && n - 1 - i >= step / 2) || i === n - 1) xl += `<text class="chart__axis" x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${dm(d.date)}</text>`; });

  // Коридор: верхняя граница слева направо, нижняя — справа налево
  const todayIdx = days.findIndex((d) => d.forecast != null);
  const band = days.map((d, i) => ({ d, i })).filter(({ d, i }) => i >= todayIdx && d.forecast != null);
  const hiPts = band.map(({ d, i }) => `${x(i)},${y(d.hi ?? d.forecast)}`);
  const loPts = band.slice().reverse().map(({ d, i }) => `${x(i)},${y(d.lo ?? d.forecast)}`);

  let zero = '';
  if (min < 0) zero = `<line class="chart__zero" x1="${pad.l}" x2="${W - pad.r}" y1="${y(0)}" y2="${y(0)}"/>`;

  let gap = '';
  if (cf.gap) {
    const gi = days.findIndex((d) => d.date === cf.gap.date);
    if (gi >= 0) {
      const gx = x(gi);
      const anchor = gx > W - 160 ? 'end' : 'start';
      const tx = anchor === 'end' ? gx - 8 : gx + 8;
      gap = `<line class="chart__gap" x1="${gx}" x2="${gx}" y1="${pad.t}" y2="${H - pad.b}"/>
        <circle class="chart__gap-dot" cx="${gx}" cy="${y(days[gi].forecast)}" r="5"/>
        <text class="chart__gap-label" x="${tx}" y="${pad.t - 8}" text-anchor="${anchor}">Кассовый разрыв ${dm(cf.gap.date)}</text>`;
    }
  }
  const today = todayIdx >= 0 ? `<line class="chart__today" x1="${x(todayIdx)}" x2="${x(todayIdx)}" y1="${pad.t}" y2="${H - pad.b}"/><text class="chart__axis" x="${x(todayIdx) + 6}" y="${pad.t + 12}">сегодня</text>` : '';

  return {
    svg: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Прогноз денег на 30 дней">
      ${grid}${zero}
      <polygon class="chart__band" points="${[...hiPts, ...loPts].join(' ')}"/>
      ${today}
      <polyline class="chart__fact" points="${line('fact')}"/>
      <polyline class="chart__forecast" points="${line('forecast')}"/>
      ${gap}${xl}
      <line class="chart__guide" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}"/>
    </svg>`,
    points: days.map((d, i) => ({
      x: x(i),
      html: `<b>${dmy(d.date)}</b>${d.fact != null ? `Факт: ${rub(d.fact)}` : `Прогноз: ${rub(d.forecast)}<br><span class="muted">Коридор: ${shortNum(d.lo)} … ${shortNum(d.hi)}</span>`}${d.pays?.length ? `<br><span class="warn">${esc(d.pays.join(', '))}</span>` : ''}`
    }))
  };
}

// Продажи по дням: столбики WB, Ozon и Маркета стопкой — как кирпичи друг на друге
const SALES_SERIES = [['wb', 'WB', 'var(--violet)'], ['ozon', 'Ozon', 'var(--blue)'], ['ym', 'ЯМ', 'var(--ym)']];
const dayTotal = (d) => sum(SALES_SERIES, ([k]) => d[k] || 0);
function salesSvg(daily, W, H) {
  const pad = { l: 56, r: 8, t: 12, b: 28 };
  const n = daily.length;
  const max = Math.max(...daily.map(dayTotal), 1) * 1.1;
  const bw = (W - pad.l - pad.r) / n;
  const y = (v) => pad.t + ((max - v) * (H - pad.t - pad.b)) / max;
  let g = '';
  for (let t = 0; t <= 3; t++) { const v = (max * t) / 3; g += `<line class="chart__grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="chart__axis" x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end">${shortNum(v)}</text>`; }
  const step = Math.ceil(n / (W < 520 ? 4 : 8));
  daily.forEach((d, i) => {
    const x0 = pad.l + i * bw + bw * 0.15, w = bw * 0.7;
    // Каждый следующий «кирпич» начинается там, где закончился предыдущий
    let base = 0;
    for (const [k, , color] of SALES_SERIES) {
      const v = d[k] || 0;
      if (v > 0) g += `<rect x="${x0}" y="${y(base + v)}" width="${w}" height="${y(base) - y(base + v)}" fill="${color}" rx="2"/>`;
      base += v;
    }
    if (i % step === 0) g += `<text class="chart__axis" x="${x0 + w / 2}" y="${H - 8}" text-anchor="middle">${dm(d.date)}</text>`;
  });
  return {
    svg: `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Продажи по дням">${g}<line class="chart__guide" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}"/></svg>`,
    points: daily.map((d, i) => ({ x: pad.l + i * bw + bw / 2, html: `<b>${dmy(d.date)}</b>${SALES_SERIES.map(([k, l]) => `${l}: ${rub(d[k] || 0)}`).join('<br>')}<br>Всего: ${rub(dayTotal(d))}` }))
  };
}

// Рисуем графики под фактическую ширину контейнера (текст остаётся чётким на любом экране)
function drawCharts() {
  for (const el of $$('[data-chart]')) {
    const W = Math.max(280, el.clientWidth);
    const type = el.dataset.chart;
    const H = type === 'cash' ? (W < 520 ? 220 : 280) : 220;
    const res = type === 'cash' ? cashSvg(state.data.cashflow, W, H) : salesSvg(state.data.sales.daily, W, H);
    el.innerHTML = res.svg + '<div class="chart__tip"></div>';
    el._points = res.points;
    // Одна «прорисовка» линий при первом показе главной
    if (type === 'cash' && !state.introDone) {
      el.classList.add('chart--intro');
      for (const pl of el.querySelectorAll('.chart__fact')) { const len = pl.getTotalLength?.() || 1000; pl.style.strokeDasharray = len; pl.style.setProperty('--len', len); }
      state.introDone = true;
    }
  }
}

// Подсказка при наведении/касании графика (делегирование — один обработчик на документ)
document.addEventListener('pointermove', (e) => {
  const el = e.target.closest?.('[data-chart]');
  if (!el || !el._points) return;
  const rect = el.getBoundingClientRect();
  const px = e.clientX - rect.left;
  let best = el._points[0];
  for (const p of el._points) if (Math.abs(p.x - px) < Math.abs(best.x - px)) best = p;
  const tip = el.querySelector('.chart__tip');
  const guide = el.querySelector('.chart__guide');
  tip.innerHTML = best.html;
  tip.style.opacity = 1;
  // Подсказка справа от точки, а у правого края — слева, чтобы не вылезала за график
  let left = best.x + 12;
  if (left + tip.offsetWidth > rect.width) left = best.x - tip.offsetWidth - 12;
  tip.style.left = `${Math.max(0, left)}px`;
  tip.style.top = '8px';
  guide.setAttribute('x1', best.x); guide.setAttribute('x2', best.x); guide.style.opacity = 0.6;
});
document.addEventListener('pointerout', (e) => {
  const el = e.target.closest?.('[data-chart]');
  if (el && !el.contains(e.relatedTarget)) { const t = el.querySelector('.chart__tip'); if (t) t.style.opacity = 0; const g = el.querySelector('.chart__guide'); if (g) g.style.opacity = 0; }
});

function delta(d, unit = '%', label = 'к прошлым 30 дням') {
  if (d == null || !Number.isFinite(d)) return '<span class="delta">нет данных за прошлый период</span>';
  const up = d >= 0;
  const val = `${up ? '+' : '−'}${Math.abs(d).toLocaleString('ru-RU', { maximumFractionDigits: 1 })}${unit === 'pp' ? ' п.п.' : '%'}`;
  return `<span class="delta ${up ? 'delta--up' : 'delta--down'}">${val}</span> <span class="delta">${label}</span>`;
}
const urgClass = (u) => (u === 'критично' ? 'urg--critical' : u === 'сегодня' ? 'urg--today' : 'urg--week');
const prioName = { high: 'Высокий', medium: 'Средний', low: 'Низкий' };

function pageHead(title, sub, actions = '', tag = '') {
  return `<div class="page__head"><div><h2 class="page__title">${title} ${tag}</h2>${sub ? `<p class="page__sub">${sub}</p>` : ''}</div>${actions ? `<div class="page__actions">${actions}</div>` : ''}</div>`;
}
function demoBanner() {
  if (state.mode !== 'demo') return '';
  return `<div class="banner" role="note">${icon('alert')}<div><b>Демо-режим.</b> Файл открыт без сервера: все цифры — примеры. Задачи, сделки и документы сохраняются в этом браузере. Запустите сервер (<span class="code">npm start</span>) и добавьте ключи в <span class="code">.env</span>, чтобы увидеть реальные данные.</div></div>`;
}
function table(headers, rows, opts = {}) {
  // headers: [{label, key?, num?}], rows: массив строк HTML <tr>
  const th = headers.map((h) => {
    const cls = h.num ? ' class="num"' : '';
    if (!h.key || !opts.sortTable) return `<th${cls} scope="col">${h.label}</th>`;
    const s = state.sort[opts.sortTable];
    const active = s.key === h.key;
    return `<th${cls} scope="col" aria-sort="${active ? (s.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button class="th-sort" data-action="sort" data-table="${opts.sortTable}" data-key="${h.key}">${h.label}${active ? (s.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
  }).join('');
  return `<div class="table-wrap"><table class="table"><thead><tr>${th}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${headers.length}" class="muted">Нет данных</td></tr>`}</tbody></table></div>`;
}
function sortRows(list, table) {
  const { key, dir } = state.sort[table];
  return [...list].sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return typeof x === 'string' ? x.localeCompare(y, 'ru') * dir : (x - y) * dir;
  });
}

function crmStats(crm = state.crm) {
  const deals = crm?.deals || [];
  const won = deals.filter((d) => crm.stages.find((s) => s.id === d.st)?.won);
  const lost = deals.filter((d) => crm.stages.find((s) => s.id === d.st)?.lost);
  const open = deals.filter((d) => !crm.stages.find((s) => s.id === d.st)?.won && !crm.stages.find((s) => s.id === d.st)?.lost);
  return {
    won, lost, open,
    conversion: won.length + lost.length ? (won.length / (won.length + lost.length)) * 100 : null,
    avgCheck: won.length ? sum(won, (d) => d.sum) / won.length : null,
    openSum: sum(open, (d) => d.sum)
  };
}

// ----- Центр решений -----
function pageDecisions() {
  const tabs = [['new', 'Новые'], ['inprogress', 'В работе'], ['postponed', 'Отложены'], ['done', 'Выполнены'], ['rejected', 'Отклонены']];
  const counts = Object.fromEntries(tabs.map(([k]) => [k, state.decisions.filter((d) => decisionStatus(d) === k).length]));
  const tab = state.filters.decTab;
  const order = { 'критично': 0, 'сегодня': 1, 'на неделе': 2 };
  const list = state.decisions.filter((d) => decisionStatus(d) === tab).sort((a, b) => order[a.urgency] - order[b.urgency] || b.effect - a.effect);
  const m = state.decMeta;
  const sub = `${m.at ? `Пересчитано ${new Date(m.at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}. ` : 'Ещё не пересчитывалось. '}` +
    `${m.source === 'ai' ? 'Решения подготовил ИИ.' : 'Работают встроенные правила: дозаказ, ДРР выше порога, артикулы в минус, кассовый разрыв, план, счета.'} Утренний разбор — в ${state.data.settings.decisionHour}:00.`;
  return `${demoBanner()}
  ${pageHead('Центр решений', sub, `<button class="btn btn--primary" type="button" data-action="dec-recompute">${icon('refresh')} Пересчитать сейчас</button>`)}
  ${m.error ? `<div class="banner">${icon('alert')}<div>ИИ не ответил, поэтому решения собраны по правилам. Причина: ${esc(m.error)}</div></div>` : ''}
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${tab === k ? 'tab--on' : ''}" role="tab" aria-selected="${tab === k}" data-action="dec-tab" data-tab="${k}">${l}<span class="tab__n">${counts[k]}</span></button>`).join('')}</div>
  <div class="decisions">
    ${list.map(decisionCard).join('') || `<div class="card empty"><p class="empty__title">${tab === 'new' ? 'Новых решений нет' : 'Здесь пусто'}</p><p>${tab === 'new' ? 'Нажмите «Пересчитать сейчас», чтобы собрать свежую картину.' : 'Решения появятся здесь после действий на вкладке «Новые».'}</p></div>`}
  </div>`;
}

function decisionCard(d) {
  const st = decisionStatus(d);
  const prog = decisionProgress(d);
  const actions = st === 'new' || st === 'postponed'
    ? `<button class="btn btn--primary" type="button" data-action="dec-accept" data-id="${d.id}">Принять</button>
       ${st === 'new' ? `<button class="btn" type="button" data-action="dec-postpone" data-id="${d.id}">Отложить на 3 дня</button>` : ''}
       <button class="btn btn--ghost" type="button" data-action="dec-reject" data-id="${d.id}">Отклонить</button>
       <button class="btn btn--ghost" type="button" data-action="dec-discuss" data-id="${d.id}">${icon('spark')} Обсудить с ИИ</button>`
    : `<button class="btn btn--ghost" type="button" data-action="dec-discuss" data-id="${d.id}">${icon('spark')} Обсудить с ИИ</button>${st === 'inprogress' || st === 'done' ? '<a class="btn btn--ghost" href="#/tasks">Открыть задачи</a>' : ''}`;
  return `<article class="card decision">
    <div>
      <div class="decision__top">
        <span class="urg ${urgClass(d.urgency)}">${esc(d.urgency)}</span>
        <span class="tag">${esc(d.area)}</span>
        ${d.source === 'ai' ? '<span class="tag tag--ai">ИИ</span>' : '<span class="tag">правило</span>'}
      </div>
      <h3 class="decision__title">${esc(d.title)}</h3>
      <p class="decision__text"><b>Ситуация.</b> ${esc(d.situation)}</p>
      <p class="decision__text" style="margin-top:8px"><b>Что сделать.</b> ${esc(d.action)} ${esc(d.why)}</p>
      <ol class="decision__steps">${d.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
      ${st === 'rejected' && d.rejectReason ? `<p class="decision__text" style="margin-top:12px"><b>Причина отказа.</b> ${esc(d.rejectReason)}</p>` : ''}
      ${st === 'postponed' ? `<p class="decision__text" style="margin-top:12px">Вернётся в «Новые» ${dmy(localIso(d.postponedUntil))}.</p>` : ''}
    </div>
    <div class="decision__side">
      <div><div class="decision__effect">${d.effect ? `+${short(d.effect)}` : '—'}</div><div class="card__note">эффект в месяц</div></div>
      <div class="card__note">Срок: <b>${dmy(d.due)}</b><br>Уверенность: ${d.confidence}%<br>Проверить: ${esc(d.metric)}</div>
      ${st === 'inprogress' || st === 'done' ? `<div><div class="card__note">Выполнено ${prog.done} из ${prog.total} задач</div><div class="bar bar--thin"><div class="bar__fill bar__fill--green" style="width:${prog.pct}%"></div></div></div>` : ''}
      <div class="decision__actions">${actions}</div>
    </div>
  </article>`;
}

/* =====================================================================
   ОТЧЁТЫ: ОПиУ (P&L по месяцам), P&L по каналам, ДДС
   Все три отчёта — одна и та же «таблица статей»: строки — статьи, колонки — периоды или каналы.
   Поэтому рисует их одна функция reportTable(), а различаются только данные.
   ===================================================================== */
const REPORT_TABS = [
  ['opiu', 'ОПиУ по месяцам', 'Отчёт о прибылях и убытках (ОПиУ, по-английски P&L) отвечает на вопрос «заработали ли мы»: от выручки по шагам вычитаем удержания маркетплейсов, себестоимость, рекламу, постоянные расходы и налог.'],
  ['pnl', 'P&L по каналам', 'Тот же расчёт прибыли, но столбцы — площадки. Видно, какой маркетплейс реально оставляет деньги после комиссий, себестоимости и рекламы, а какой только «крутит» выручку.'],
  ['dds', 'ДДС', 'Движение денежных средств отвечает на вопрос «хватит ли денег»: что пришло на счёт и что ушло, по статьям. Прибыль и деньги — не одно и то же: закупка товара впрок уменьшает деньги, но не прибыль.']
];

// Число в ячейке: рубли без значка ₽ (он в заголовке), проценты — со знаком %
const cellText = (v, type) => (v == null ? '' : type === 'pct' ? pct(v) : nf.format(v));

function reportTable(rep, caption) {
  const last = rep.columns.length - 1;
  const head = rep.columns.map((c, i) => `<th scope="col" class="${i === last ? 'col--total' : ''}">${esc(c.label)}${c.note ? `<span class="report__note">${esc(c.note)}</span>` : ''}</th>`).join('');
  const body = rep.rows.map((r) => {
    const cells = r.values.map((v, i) => {
      // Итоговые строки: плюс — зелёный, минус — красный; в остальных красим только минусы
      const tone = r.type === 'pct' || v == null ? '' : r.type === 'total' ? (v < 0 ? 'cell--bad' : 'cell--good') : v < 0 ? 'cell--bad' : '';
      return `<td class="${[i === last ? 'col--total' : '', tone].filter(Boolean).join(' ')}">${cellText(v, r.type)}</td>`;
    }).join('');
    return `<tr class="r--${r.type}"><th scope="${r.type === 'section' ? 'rowgroup' : 'row'}">${esc(r.label)}</th>${cells}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="table report"><caption class="visually-hidden">${esc(caption)}</caption>
    <thead><tr><th scope="col">Статья, ₽</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// Скачивание текста файлом: Blob — «файл в памяти», ссылка на него живёт, пока мы её не отзовём
function downloadText(text, filename, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// CSV для Excel: разделитель «;» и метка BOM в начале — иначе русский Excel покажет «кракозябры»
function reportCsv(rep, name) {
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = [['Статья', ...rep.columns.map((c) => (c.note ? `${c.label} (${c.note})` : c.label))].map(q).join(';')];
  for (const r of rep.rows) lines.push([q(r.label), ...r.values.map((v) => (v == null ? '' : String(v).replace('.', ',')))].join(';'));
  downloadText(`\uFEFF${lines.join('\r\n')}`, `${name}-${localIso()}.csv`, 'text/csv;charset=utf-8');
}
