/* =====================================================================
   РНП — «РУКА НА ПУЛЬСЕ»
   Ежедневная сводка: одна колонка — один день. Как медсестра каждое утро записывает
   температуру и давление в карту пациента: по ряду цифр сразу видно, где «скачок».
   ===================================================================== */
const RNP_FIELDS = ['orders', 'ordersSum', 'sales', 'payout', 'cogs', 'ads', 'returns'];
// Сумма показателей дня по выбранным каналам
function rnpDay(day, keys) {
  const t = Object.fromEntries(RNP_FIELDS.map((f) => [f, 0]));
  for (const k of keys) for (const f of RNP_FIELDS) t[f] += day[k]?.[f] || 0;
  return t;
}
// Из сумм — показатели строки таблицы. days — сколько дней в колонке (для плана и постоянных расходов)
function rnpMetrics(t, R, all, days = 1) {
  const plan = all ? R.planPerDay * days : null;
  const profit = t.payout - t.cogs - t.ads - (all ? R.fixedPerDay * days : 0);
  return {
    orders: t.orders, ordersSum: t.ordersSum, avg: t.orders ? t.ordersSum / t.orders : null, sales: t.sales,
    plan, planPct: plan ? (t.sales / plan) * 100 : null,
    ads: t.ads, drr: t.ordersSum ? (t.ads / t.ordersSum) * 100 : null,
    payout: t.payout, profit, margin: t.sales ? (profit / t.sales) * 100 : null, returns: t.returns
  };
}
// Строки таблицы: [ключ, название, формат, правило подсветки]
// up — «больше лучше» (сравниваем со средним за период), plan / drr / neg / ret — свои пороги
const RNP_ROWS = [
  ['orders', 'Заказы, шт', 'n', 'up'], ['ordersSum', 'Заказы, ₽', 'r', 'up'], ['avg', 'Средний чек заказа, ₽', 'r', ''],
  ['sales', 'Продажи (выкупы), ₽', 'r', 'up'], ['plan', 'План продаж, ₽', 'r', ''], ['planPct', 'Выполнение плана', 'p', 'plan'],
  ['ads', 'Реклама, ₽', 'r', ''], ['drr', 'ДРР к заказам', 'p', 'drr'], ['payout', 'К выплате, ₽', 'r', 'up'],
  ['profit', 'Прибыль, ₽', 'r', 'neg'], ['margin', 'Маржа', 'p', 'neg'], ['returns', 'Возвраты, шт', 'n', 'ret']
];

function rnpTone(rule, v, avg, maxDrr) {
  if (v == null) return '';
  if (rule === 'up' && avg) return v >= avg * 1.15 ? 'cell--good' : v <= avg * 0.85 ? 'cell--bad' : '';
  if (rule === 'plan') return v >= 100 ? 'cell--good' : v < 85 ? 'cell--bad' : '';
  if (rule === 'drr') return v > maxDrr ? 'cell--bad' : '';
  if (rule === 'neg') return v < 0 ? 'cell--bad' : '';
  if (rule === 'ret') return avg && v >= 2 && v >= avg * 1.6 ? 'cell--bad' : '';
  return '';
}

// Сигналы дня: короткие выводы «что не так и что сделать». Сравниваем вчера (полный день) со средним за 7 дней до него
function rnpSignals(R, keys, ch) {
  const out = [];
  const y = R.days.at(-2);
  const prev = R.days.slice(-9, -2);
  if (y && prev.length) {
    for (const k of keys) {
      const yv = rnpDay(y, [k]).ordersSum;
      const avg = sum(prev, (d) => rnpDay(d, [k]).ordersSum) / prev.length;
      if (avg > 0) {
        const d = ((yv - avg) / avg) * 100;
        if (d <= -20) out.push(['bad', `${mpFull(k)}: заказы вчера ${short(yv)} — на ${Math.round(-d)}% ниже среднего за неделю. Проверьте цены, остатки и рекламу.`]);
        else if (d >= 20) out.push(['good', `${mpFull(k)}: заказы вчера ${short(yv)} — на ${Math.round(d)}% выше среднего. Убедитесь, что хватит остатков.`]);
      }
      const t = rnpDay(y, [k]);
      if (t.ordersSum && (t.ads / t.ordersSum) * 100 > R.maxDrr) out.push(['warn', `${mpFull(k)}: ДРР вчера ${pct((t.ads / t.ordersSum) * 100)} при пороге ${R.maxDrr}%.`]);
    }
  }
  if (ch === 'all') {
    const p = state.data.plan;
    const should = (p.plan * p.day) / p.days;
    if (should) {
      const d = ((p.fact - should) / should) * 100;
      out.push([d >= 0 ? 'good' : d < -10 ? 'bad' : 'warn', `План месяца: продано ${short(p.fact)}, к сегодняшнему дню нужно было ${short(should)} (${d >= 0 ? '+' : '−'}${Math.abs(Math.round(d))}%). Прогноз на месяц — ${short(p.forecast)}.`]);
    }
  }
  const arts = state.analytics.articles.filter((a) => ch === 'all' || a.mp === ch);
  const reorder = state.data.stock.reorderDays;
  for (const a of arts.filter((x) => x.days != null && x.days < reorder).sort((a1, a2) => a1.days - a2.days).slice(0, 3)) {
    out.push(['bad', `Арт. ${a.article} (${mpName(a.mp)}) закончится через ${a.days} дн. — пора дозаказать.`]);
  }
  for (const a of arts.filter((x) => x.profit < 0).slice(0, 2)) out.push(['warn', `Арт. ${a.article} (${mpName(a.mp)}) продаётся в минус: маржа ${pct(a.margin)}.`]);
  return out.slice(0, 8);
}

// Сигнал по артикулу для таблицы пульса
function articleSignal(a, maxDrr, reorder) {
  if (a.days != null && a.days < reorder) return ['tag--red', 'Дозаказ'];
  if (a.profit < 0) return ['tag--red', 'В минус'];
  if (a.drr > maxDrr) return ['tag--amber', 'ДРР выше порога'];
  if (a.trend7 != null && a.trend7 <= -10) return ['tag--amber', 'Падает'];
  if (a.trend7 != null && a.trend7 >= 10) return ['tag--green', 'Растёт'];
  return ['', 'Норма'];
}

  const all = f.rnpCh === 'all';
  const keys = all ? chans : [f.rnpCh];
  const n = Math.min(f.rnpDays, R.days.length);
  // Колонки — дни от сегодня к прошлому: свежие цифры всегда слева, у названий строк
  const days = R.days.slice(-n).reverse();
  const perDay = days.map((d) => rnpMetrics(rnpDay(d, keys), R, all));
  const totalT = Object.fromEntries(RNP_FIELDS.map((k) => [k, sum(days, (d) => rnpDay(d, keys)[k])]));
  const total = rnpMetrics(totalT, R, all, n);
  // «Средний день» — для денег и штук делим итог на число дней, проценты остаются как в итоге
  const avg = Object.fromEntries(Object.entries(total).map(([k, v]) => [k, v == null ? null : ['avg', 'planPct', 'drr', 'margin'].includes(k) ? v : v / n]));
  // Среднее «для сравнения» считаем без сегодняшнего дня: он ещё не закончился

/* =====================================================================
   НАЛОГИ: расчёт УСН и документы по шаблонам
   Декларация считается «нарастающим итогом»: I квартал → полугодие → 9 месяцев → год.
   Как счётчик воды: в квитанции пишут показания с начала года, а платим разницу с прошлым разом.
   ===================================================================== */
const Q_NAMES = ['I квартал', 'полугодие', '9 месяцев', 'год'];
const KBK = { income: '18210501011011000110', 'income-expense': '18210501021011000110' };

function usnCalc({ obj, rate, hasEmployees, inc, exp, contr }) {
  const cum = (arr) => arr.reduce((acc, x, i) => [...acc, (acc[i - 1] || 0) + (Number(x) || 0)], []);
  const I = cum(inc), E = cum(exp), C = cum(contr);
  const r = (Number(rate) || 0) / 100;
  if (obj === 'income') {
    const tax = I.map((x) => Math.round(x * r));
    // Взносы уменьшают налог: с работниками — не больше чем наполовину, без работников — хоть до нуля
    const ded = tax.map((t, i) => Math.round(Math.min(C[i], hasEmployees ? t * 0.5 : t)));
    const due = tax.map((t, i) => t - ded[i]);
    return { I, E, C, tax, ded, due, pay: due.map((x, i) => x - (due[i - 1] || 0)), base: I, minTax: 0, useMin: false };
  }
  const base = I.map((x, i) => Math.max(0, x - E[i]));
  const loss = I.map((x, i) => Math.max(0, E[i] - x));
  const tax = base.map((b) => Math.round(b * r));
  // Минимальный налог — 1% от доходов за год, если обычный налог получился меньше
  const minTax = Math.round(I[3] * 0.01);
  const useMin = minTax > tax[3];
  const due = tax.map((t, i) => (i === 3 && useMin ? minTax : t));
  return { I, E, C, tax, ded: [0, 0, 0, 0], due, pay: due.map((x, i) => x - (due[i - 1] || 0)), base, loss, minTax, useMin };
}

}

  T.quarters.slice(0, kind === 'notice' ? 3 : 4).forEach((q, i) => {
    fields.push(
      { name: `inc${i}`, label: `Доходы, ${i + 1} кв. <span class="muted">(${qSrc(q)})</span>`, type: 'number', value: q.income, half: true },
      { name: `contr${i}`, label: `Взносы уплачены, ${i + 1} кв.`, type: 'number', value: q.contributions, half: true },
      { name: `exp${i}`, label: `Расходы, ${i + 1} кв.`, type: 'number', value: q.expense }
    );
  });
  return fields;
}

// Значения формы → вход для расчёта
function taxInput(v) {
  const num = (k) => Number(v[k]) || 0;
  return {
    obj: v.taxObject === 'income-expense' ? 'income-expense' : 'income',
    rate: num('rate') || (v.taxObject === 'income-expense' ? 15 : 6),
    hasEmployees: v.hasEmployees !== 'no',
    inc: [0, 1, 2, 3].map((i) => num(`inc${i}`)),
    exp: [0, 1, 2, 3].map((i) => num(`exp${i}`)),
    contr: [0, 1, 2, 3].map((i) => num(`contr${i}`))
  };
}

// Оформление печатного документа: светлый лист A4, панель с кнопкой «Печать» не попадает на бумагу

  .sheet{max-width:840px;margin:24px auto;padding:40px 48px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}

  @media (max-width:640px){.sheet{margin:0;padding:20px 16px} td.val,th.val{width:auto}}

function taxDocument(kind, v) {

  const x = taxInput(v);
  const c = usnCalc(x);
  const money = (n) => nf.format(Math.round(n || 0));
  const val = (s) => (String(s ?? '').trim() ? esc(s) : '<span class="blank">не заполнено</span>');
  const plus = (n) => (n > 0 ? money(n) : '—');
  const minus = (n) => (n < 0 ? money(-n) : '—');
  const keyTable = (rows) => `<table><tbody>${rows.map(([k, s]) => `<tr><td class="key">${k}</td><td>${s}</td></tr>`).join('')}</tbody></table>`;
  const lines = (rows) => `<table><thead><tr><th>Код строки</th><th>Показатель</th><th class="val">Значение</th></tr></thead><tbody>${rows.map(([code, l, s]) => `<tr><td class="code">${code}</td><td>${l}</td><td class="val">${s}</td></tr>`).join('')}</tbody></table>`;
  const objName = x.obj === 'income' ? 'доходы' : 'доходы, уменьшенные на величину расходов';

  for (const [k, l] of [['inn', 'ИНН'], ['oktmo', 'ОКТМО'], ['ifns', 'код налоговой'], ['name', 'ФИО или название']]) if (!String(v[k] || '').trim()) warn.push(`Не заполнено: ${l}.`);

    <h2>Раздел I. Доходы и расходы</h2>
    <table><thead><tr><th>№</th><th>Дата и номер документа</th><th>Содержание операции</th><th class="val">Доходы, ₽</th>${showExp ? '<th class="val">Расходы, ₽</th>' : ''}</tr></thead><tbody>${qBlocks}</tbody></table>
    ${x.obj === 'income' ? `<h2>Раздел IV. Расходы, уменьшающие налог (страховые взносы)</h2>
    <table><thead><tr><th>Период</th><th class="val">Уплачено взносов, ₽</th></tr></thead><tbody>${qSel.map((qn) => `<tr><td>${qn} квартал</td><td class="val">${money(Number(v[`contr${qn - 1}`]) || T.quarters[qn - 1].contributions)}</td></tr>`).join('')}</tbody></table>` : ''}

  return { title, filename: `kudir-${year}${v.quarter === 'all' ? '' : `-q${v.quarter}`}.html`, html: docShell(title, body) };

/* Предпросмотр документа прямо в дашборде: <iframe srcdoc> — «окно в окне» со своим HTML и стилями.
   Новая вкладка (window.open) ненадёжна: её режут блокировщики всплывающих окон.
   Печать из iframe печатает только документ, без интерфейса дашборда. */
function openDoc({ html, filename, title }) {
  $('.docview')?.remove();
  const box = document.createElement('div');
  box.className = 'docview';
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.setAttribute('aria-label', title);
  box.innerHTML = `<div class="docview__bar"><b class="docview__title">${esc(title)}</b><div class="docview__actions">
    <button class="btn btn--primary" type="button" data-doc="print">${icon('report')} Печать / PDF</button>
    <button class="btn" type="button" data-doc="save">${icon('download')} Скачать</button>
    <button class="btn btn--icon btn--ghost" type="button" data-doc="close" aria-label="Закрыть предпросмотр">${icon('x')}</button>
  </div></div><iframe class="docview__frame" title="${esc(title)}"></iframe>`;
  document.body.append(box);
  const frame = $('iframe', box);
  // Внутри предпросмотра своя панель документа не нужна — прячем её классом embed
  frame.srcdoc = html.replace('<body>', '<body class="embed">');
  box.addEventListener('click', (e) => {
    const act = e.target.closest('[data-doc]')?.dataset.doc;
    if (act === 'print') frame.contentWindow.print();
    if (act === 'save') downloadText(html, filename, 'text/html;charset=utf-8');
    if (act === 'close') box.remove();
  });
  $('[data-doc="print"]', box).focus();
}

function openTaxDoc(kind) {

  const extra = kind === 'kudir' ? Object.fromEntries(T.quarters.flatMap((q, i) => [[`inc${i}`, q.income], [`contr${i}`, q.contributions], [`exp${i}`, q.expense]])) : {};

    fields: taxFields(kind),

/* =====================================================================
   ПЕРЕТАСКИВАНИЕ (Drag & Drop) — для задач и сделок
   На телефонах drag-and-drop не работает пальцем, поэтому статус и этап
   также меняются в окне редактирования (нажмите на карточку).
   ===================================================================== */
function bindDragDrop() {
  const board = $('[data-board]');
  if (!board) return;
  const kind = board.dataset.board;
  board.addEventListener('dragstart', (e) => {
    const card = e.target.closest('[data-drag]');
    if (!card) return;
    e.dataTransfer.setData('text/plain', card.dataset.drag);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('tcard--dragging');
  });
  board.addEventListener('dragend', (e) => e.target.closest?.('[data-drag]')?.classList.remove('tcard--dragging'));
  board.addEventListener('dragover', (e) => {
    const col = e.target.closest('[data-drop]');
    if (!col) return;
    e.preventDefault();
    $$('.board__col--over', board).forEach((c) => c !== col && c.classList.remove('board__col--over'));
    col.classList.add('board__col--over');
  });
  board.addEventListener('dragleave', (e) => { const col = e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('board__col--over'); });
  board.addEventListener('drop', async (e) => {
    const col = e.target.closest('[data-drop]');
    if (!col) return;
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    const target = col.dataset.drop;
    try {
      if (kind === 'tasks') {
        const t = state.tasks.find((x) => x.id === id);
        if (t && t.status !== target) await saveTask({ ...t, status: target });
      } else {
        const d = state.crm.deals.find((x) => x.id === id);
        if (d && d.st !== target) { await saveDeal({ ...d, st: target }); toast(state.crm.provider === 'amocrm' || state.crm.provider === 'bitrix' ? 'Этап обновлён в CRM' : 'Этап сделки обновлён'); }
      }
    } catch (err) { toast(err.message); }
    render();
  });
}

/* =====================================================================
   МОДАЛЬНОЕ ОКНО С ФОРМОЙ
   Валидация: ошибка показывается при уходе с поля (blur) и исчезает при вводе.
   ===================================================================== */
let lastFocus = null;
function openModal({ title, fields, submit = 'Сохранить', onSubmit, danger }) {
  lastFocus = document.activeElement;
  const fieldHtml = (f) => {
    // «Поле-пояснение»: просто текст между полями, ничего не отправляет
    if (f.type === 'note') return `<p class="card__note modal__note">${f.label}</p>`;
    const id = `f-${f.name}`;
    const req = f.required ? 'required aria-required="true"' : '';
    let control;
    if (f.type === 'select') control = `<select class="select" id="${id}" name="${f.name}" ${req}>${f.options.map(([v, l]) => `<option value="${esc(v)}" ${String(f.value) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') control = `<textarea class="textarea" id="${id}" name="${f.name}" ${req}>${esc(f.value || '')}</textarea>`;
    else control = `<input class="input" id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" ${f.type === 'number' ? 'min="0" step="1" inputmode="numeric"' : ''} ${req}>`;
    return `<div class="field ${f.half ? '' : ''}"><label class="field__label" for="${id}">${f.label}</label>${control}<div class="field__error" id="${id}-err"></div></div>`;
  };
  // Поля с half: true выводим парами в две колонки
  let body = '';
  for (let i = 0; i < fields.length; i++) {
    if (fields[i].half && fields[i + 1]?.half) { body += `<div class="grid-2">${fieldHtml(fields[i])}${fieldHtml(fields[i + 1])}</div>`; i++; }
    else body += fieldHtml(fields[i]);
  }
  const m = $('#modal');
  m.innerHTML = `<div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form class="modal__form" novalidate>
      <div class="modal__head"><h2 class="modal__title" id="modal-title">${title}</h2><button class="btn btn--icon btn--ghost" type="button" data-action="modal-close" aria-label="Закрыть">${icon('x')}</button></div>
      <div class="modal__body">${body}</div>
      <div class="modal__foot">
        ${danger ? `<button class="btn btn--danger" type="button" data-action="modal-danger">${danger.label}</button>` : ''}
        <button class="btn btn--ghost" type="button" data-action="modal-close">Отмена</button>
        <button class="btn btn--primary" type="submit">${submit}</button>
      </div>
    </form></div>`;
  m.classList.add('modal--open');
  const form = $('form', m);
  const validate = (el) => {
    const err = $(`#${el.id}-err`);
    const bad = el.required && !String(el.value).trim();
    el.classList.toggle('input--invalid', bad);
    el.setAttribute('aria-invalid', bad);
    err.textContent = bad ? 'Заполните это поле' : '';
    return !bad;
  };
  form.addEventListener('focusout', (e) => e.target.matches('input,select,textarea') && validate(e.target));
  form.addEventListener('input', (e) => { e.target.classList.remove('input--invalid'); const err = $(`#${e.target.id}-err`); if (err) err.textContent = ''; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const els = $$('input,select,textarea', form);
    if (!els.map(validate).every(Boolean)) { els.find((x) => x.classList.contains('input--invalid'))?.focus(); return; }
    const btn = $('button[type=submit]', form);
    btn.disabled = true;
    try { await onSubmit(Object.fromEntries(new FormData(form))); closeModal(); render(); }
    catch (err) { toast(err.message); btn.disabled = false; }
  });
  if (danger) $('[data-action="modal-danger"]', m).addEventListener('click', async () => { if (!confirm(danger.confirm)) return; try { await danger.run(); closeModal(); render(); } catch (err) { toast(err.message); } });
  setTimeout(() => $('input,select,textarea', form)?.focus(), 30);
}
function closeModal() { const m = $('#modal'); m.classList.remove('modal--open'); m.innerHTML = ''; lastFocus?.focus?.(); }

// Ловушка фокуса: Tab не уходит из открытого окна
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('.docview')) return $('.docview').remove();
    if ($('#modal').classList.contains('modal--open')) return closeModal();
    if ($('#chat').classList.contains('chat--open')) return closeChat();
    if ($('#sidebar').classList.contains('sidebar--open')) return closeMenu();
    $('#searchResults').classList.remove('search__results--open');
  }
  if (e.key === 'Tab' && $('#modal').classList.contains('modal--open')) {
    const f = $$('#modal button, #modal input, #modal select, #modal textarea').filter((x) => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

// Ответ в демо-режиме — по примерам, честно с пометкой
function demoAnswer(q) {
  const D = state.data;
  const t = q.toLowerCase();
  if (/ден|касс|разрыв|счет|счёт/.test(t)) return `Сейчас на счетах ${rub(D.cashflow.start)}. ${D.cashflow.gap ? `По прогнозу кассовый разрыв ${dmy(D.cashflow.gap.date)}: ${rub(D.cashflow.gap.amount)} — из-за платежей «${D.cashflow.gap.reason}». Предлагаю перенести оплату поставщику и проверить ближайшие выплаты WB и Ozon.` : 'Разрывов в ближайшие 30 дней не видно.'}\n\n(Демо-режим: цифры — примеры.)`;
  if (/рекл|кампан|дрр/.test(t)) { const bad = D.ads.campaigns.filter((c) => c.drr == null || c.drr > D.ads.maxDrr); return `Выше порога ДРР ${D.ads.maxDrr}%: ${bad.map((c) => `«${c.name}» (${c.drr == null ? 'нет заказов' : `${c.drr}%`}, расход ${rub(c.spend)})`).join('; ')}.\n\n(Демо-режим: цифры — примеры.)`; }
  if (/заказ|остат|склад|дозак/.test(t)) { const low = D.stock.items.filter((x) => x.days < D.stock.reorderDays); return `Остатка меньше чем на ${D.stock.reorderDays} дней: ${low.map((x) => `${x.article} — ${x.days} дн.`).join(', ')}. Решения о дозаказе — в Центре решений.\n\n(Демо-режим: цифры — примеры.)`; }
  if (/план/.test(t)) return `Факт месяца ${rub(D.plan.fact)} из ${rub(D.plan.plan)} (${D.plan.pct}%). Прогноз на конец месяца — ${rub(D.plan.forecast)}.\n\n(Демо-режим: цифры — примеры.)`;
  return `Выручка за 30 дней ${rub(D.kpi.revenue.value)}, чистая прибыль ${rub(D.kpi.profit.value)}, маржа ${D.kpi.margin.value}%. Спросите про деньги, рекламу, склад или план.\n\n(Демо-режим: подключите сервер и ключ Claude, чтобы я отвечал по живым данным.)`;
}
async function sendChat(text) {
  if (!text.trim()) return;
  state.chat.push({ role: 'user', content: text.trim() });
  renderChat(true);
  try {
    let reply;
    if (state.mode === 'live') reply = (await api('POST', '/api/chat', { messages: state.chat })).reply;
    else { await new Promise((r) => setTimeout(r, 400)); reply = demoAnswer(text); }
    state.chat.push({ role: 'assistant', content: reply });
  } catch (e) {
    state.chat.push({ role: 'assistant', content: `Не получилось ответить: ${e.message}` });
  }
  sessionStorage.setItem('bos_chat', JSON.stringify(state.chat.slice(-30)));
  renderChat();
}

function searchResults(q) {
  q = q.trim().toLowerCase();

  const out = [];
  for (const [k, l] of MENU) if (l.toLowerCase().includes(q)) out.push({ kind: 'раздел', title: l, href: `#/${k}` });
  for (const t of state.tasks) if (t.title.toLowerCase().includes(q)) out.push({ kind: 'задача', title: t.title, href: '#/tasks' });
  for (const d of state.crm.deals) if (d.c.toLowerCase().includes(q)) out.push({ kind: 'сделка', title: d.c, href: '#/crm' });
  for (const d of state.documents) if (`${d.name} ${d.ai?.counterparty || ''}`.toLowerCase().includes(q)) out.push({ kind: 'документ', title: d.name, href: '#/documents' });
  for (const a of state.analytics.articles) if (`${a.article} ${a.name}`.toLowerCase().includes(q)) out.push({ kind: 'артикул', title: `${a.article} ${a.name}`, href: '#/analytics', q: a.article });
  return out.slice(0, 10);
}

    toast('Решения пересчитаны');
  } catch (e) { toast(e.message); }
  btn && (btn.disabled = false);
}

/* =====================================================================
   ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
   Один обработчик на весь документ вместо сотни на каждой кнопке.
   Аналогия: один администратор на входе вместо охранника у каждой двери.
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id;
  switch (a) {
    case 'menu': return $('#sidebar').classList.contains('sidebar--open') ? closeMenu() : openMenu();
    case 'scrim': closeMenu(); return closeChat();
    case 'chat-open': closeMenu(); return openChat();
    case 'chat-close': return closeChat();
    case 'chat-hint': return sendChat(el.dataset.text);
    case 'sync': return syncNow(el);
    case 'modal-close': return closeModal();
    case 'task-new': return taskModal(el.dataset.title ? { title: el.dataset.title } : {});
    case 'task-edit': return taskModal(state.tasks.find((t) => t.id === id));
    case 'deal-new': return dealModal();
    case 'deal-edit': return dealModal(state.crm.deals.find((d) => d.id === id));
    case 'doc-upload': return $('#fileInput').click();
    case 'doc-filter': state.filters.docSource = el.dataset.value; return render();
    case 'doc-delete': {
      const d = state.documents.find((x) => x.id === id);
      if (!d || !confirm(`Удалить документ «${d.name}»? Файл будет удалён без возможности восстановления.`)) return;
      try { if (state.mode === 'live') await api('DELETE', `/api/documents/${id}`); state.documents = state.documents.filter((x) => x.id !== id); persistDemo(); toast('Документ удалён'); render(); } catch (err) { toast(err.message); }
      return;
    }
    case 'sort': {
      const s = state.sort[el.dataset.table];
      if (s.key === el.dataset.key) s.dir *= -1; else { s.key = el.dataset.key; s.dir = -1; }
      return render();
    }
    case 'dec-tab': state.filters.decTab = el.dataset.tab; return render();
    case 'rep-tab': state.filters.repTab = el.dataset.tab; return render();
    case 'rep-csv': return reportCsv(state.data[state.filters.repTab], { opiu: 'opiu', pnl: 'pnl-kanaly', dds: 'dds' }[state.filters.repTab]);
    case 'rnp-ch': state.filters.rnpCh = el.dataset.value; return render();
    case 'rnp-days': state.filters.rnpDays = Number(el.dataset.value); return render();
    case 'tax-doc': return openTaxDoc(el.dataset.kind);
    case 'dec-recompute': return recomputeDecisions(el);
    case 'dec-accept': el.disabled = true; try { await decide(id, 'accept'); toast('Решение принято: шаги добавлены в задачи'); } catch (err) { toast(err.message); el.disabled = false; } return;
    case 'dec-postpone': try { await decide(id, 'postpone'); toast('Отложено на 3 дня'); } catch (err) { toast(err.message); } return;
    case 'dec-reject': {
      const d = state.decisions.find((x) => x.id === id);
      return openModal({
        title: 'Отклонить решение', submit: 'Отклонить решение',
        fields: [{ name: 'reason', label: `Почему не подходит «${d.title}»? ИИ учтёт причину в следующий раз.`, type: 'textarea', required: true }],
        onSubmit: async (v) => { await decide(id, 'reject', v.reason); toast('Решение отклонено'); }
      });
    }
    case 'dec-discuss': {
      const d = state.decisions.find((x) => x.id === id);
      return openChat(`Обсудим решение «${d.title}». Ситуация: ${d.situation} Стоит ли это делать и какие есть альтернативы?`);
    }
  }
});

// Поля фильтров (select, input, checkbox) — общий обработчик изменений
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.input) {
    state.filters[el.dataset.input] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.input !== 'articleQuery') render();
  }
  if (el.dataset.docStatus) {
    try { await setDocStatus(el.dataset.docStatus, el.value); toast(`Статус: ${el.value}`); } catch (err) { toast(err.message); }
  }
});
// Фильтр артикулов — по мере ввода, с сохранением позиции курсора
document.addEventListener('input', (e) => {
  if (e.target.dataset.input !== 'articleQuery') return;
  state.filters.articleQuery = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const inp = $('#artQuery'); inp.focus(); inp.setSelectionRange(pos, pos);
});
$('#fileInput').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  try { await uploadFiles(files); if (state.page !== 'documents') location.hash = '#/documents'; } catch (err) { toast(err.message); }
});

// Перерисовываем графики при смене ширины окна (с задержкой, чтобы не дёргать на каждом пикселе)
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 150); });
window.addEventListener('hashchange', route);

/* =====================================================================
   СТАРТ
   Пробуем сервер; если его нет (файл открыт напрямую) — демо-режим.
   ===================================================================== */
(async function start() {
  state.chat = JSON.parse(sessionStorage.getItem('bos_chat') || '[]');
  if (location.protocol === 'file:') loadDemo();
  else {
    try { await loadLive(); }
    catch (e) { if (e.message === 'Нужно войти') return; console.warn('Сервер недоступен, демо-режим:', e.message); loadDemo(); }
  }
  route();
  // В live-режиме тихо обновляем данные раз в 5 минут
  if (state.mode === 'live') setInterval(async () => { if (!$('#modal').classList.contains('modal--open')) { try { await loadLive(); render(); } catch { /* сеть */ } } }, 5 * 60000);
})();
</script>
</body>
</html>
